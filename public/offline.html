<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1730" />
    <title>Rack &amp; Frame — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f7;color:#0f172a;font-family:system-ui,-apple-system,sans-serif;padding:24px}.card{width:min(540px,100%);background:#fff;border:1px solid #cbd5e1;border-radius:28px;padding:32px;box-shadow:0 20px 50px #0f172a1f}.tag{color:#0f766e;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:32px;margin:12px 0}p{line-height:1.65;color:#475569}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}button,a{border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">Rack &amp; Frame</div>
      <h1>You’re offline</h1>
      <p>The app cannot reach the internet at the moment. Any screen already open should be kept open. Reconnect before submitting a score, booking or approval so you receive a clear confirmation.</p>
      <div class="actions"><button class="primary" onclick="location.reload()">Try again</button><a class="secondary" href="/">Return home</a></div>
    </main>
  </body>
</html>
